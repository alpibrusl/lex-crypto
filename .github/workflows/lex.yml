name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lex toolchain
        run: |
          set -e
          LEX_VERSION="0.11.31"
          curl -fsSL -o /tmp/lex.tar.gz \
            "https://github.com/alpibrusl/lex-lang/releases/download/v${LEX_VERSION}/lex-v${LEX_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/lex.tar.gz -C /tmp
          echo "/tmp/lex-v${LEX_VERSION}-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"

      - name: Install package dependencies
        run: lex pkg install

      - name: Type-check (strict)
        run: lex check --strict src/main.lex

      - name: Format check
        run: lex fmt --check src/ tests/

      - name: Test
        run: lex test
